<svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 0 250 40" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      /* cls-1 / cls-2 are the recolor hooks: the cyberpunk theme shows them as
         white + cyan on a dark sheet; the printer theme recolors BOTH to blue
         (#005a9e) so the logo stays legible on white. Keep shapes from
         overlapping so nothing disappears once they share a color. */
      .cls-1 { fill: #fff; }
      .cls-2 { fill: #49dbe5; }
    </style>
  </defs>
  <g id="Layer_1-2">
    <path class="cls-2" d="M4,8 L22,20 L4,32 Z" />
    <text x="34" y="29" font-family="'Courier New', monospace" font-size="24" font-weight="700" letter-spacing="1"><tspan class="cls-1">YOUR</tspan><tspan class="cls-2">COMPANY</tspan></text>
  </g>
</svg>
