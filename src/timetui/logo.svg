<svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 0 250 40" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      /* White master logo: every shape is white by default and tagged with the
         recolor roles, so the report retints it per theme. Use the semantic
         classes primary / secondary / accent (or the Illustrator-export aliases
         cls-1 / cls-2 / cls-3, which map to the same roles). Keep shapes from
         overlapping so nothing disappears once they share a color. */
      .primary, .cls-1 { fill: #fff; }
      .secondary, .cls-2 { fill: #fff; }
      .accent, .cls-3 { fill: #fff; }
    </style>
  </defs>
  <g id="Layer_1-2">
    <path class="secondary" d="M4,8 L22,20 L4,32 Z" />
    <text x="34" y="29" font-family="'Courier New', monospace" font-size="24" font-weight="700" letter-spacing="1"><tspan class="primary">YOUR</tspan><tspan class="secondary">COMPANY</tspan></text>
  </g>
</svg>
