[project]
name = "timetui"
version = "0.1.0"
description = "A pretty, billing-focused Textual TUI for Time Warrior"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cultlead3r" }]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.7",
    "qrcode>=8.0",
    "playwright>=1.60.0",
]

[project.scripts]
timetui = "timetui.app:main"

[project.urls]
Homepage = "https://github.com/cultlead3r/timetui"
Repository = "https://github.com/cultlead3r/timetui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-textual-snapshot>=1.0.0",
    "textual-dev>=1.8.0",
]
